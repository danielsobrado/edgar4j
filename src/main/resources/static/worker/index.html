<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>Edgar4j Mobile Worker</title>
  <style>
    :root { font-family: system-ui, sans-serif; color-scheme: light dark; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: Canvas; color: CanvasText; }
    main { width: min(92vw, 520px); padding: 24px; border: 1px solid color-mix(in srgb, CanvasText 20%, transparent); border-radius: 16px; }
    h1 { margin-top: 0; font-size: 1.5rem; }
    .muted { opacity: .72; line-height: 1.45; }
    .row { display: flex; justify-content: space-between; gap: 16px; align-items: center; padding: 10px 0; }
    input[type="number"] { width: 84px; padding: 7px; }
    button { width: 100%; padding: 12px 16px; border: 0; border-radius: 10px; font-weight: 700; cursor: pointer; }
    #start { background: #2563eb; color: white; }
    #stop { margin-top: 8px; background: #991b1b; color: white; }
    .status { margin: 16px 0; padding: 12px; border-radius: 10px; background: color-mix(in srgb, CanvasText 8%, transparent); }
    .metric { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; text-align: center; }
    .metric strong { display: block; font-size: 1.25rem; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
<main>
  <h1>Edgar4j Mobile Worker</h1>
  <p class="muted">Opt in to help download small SEC artifacts while this page stays open. The server remains authoritative and verifies every result.</p>

  <div class="row"><label for="wifiOnly">Wi-Fi only</label><input id="wifiOnly" type="checkbox" checked></div>
  <div class="row"><label for="chargingOnly">Charging only</label><input id="chargingOnly" type="checkbox" checked></div>
  <div class="row"><label for="minBattery">Minimum battery %</label><input id="minBattery" type="number" min="0" max="100" value="40"></div>
  <div class="row"><label for="maxMb">Maximum artifact MB</label><input id="maxMb" type="number" min="1" max="50" value="10"></div>

  <div class="status">
    <div id="state">Stopped</div>
    <div id="detail" class="muted">Press Start to opt in.</div>
  </div>
  <div class="metric">
    <div><strong id="completed">0</strong><span class="muted">completed</span></div>
    <div><strong id="failed">0</strong><span class="muted">failed</span></div>
    <div><strong id="cached">0</strong><span class="muted">cache hits</span></div>
  </div>

  <button id="start" type="button">Start worker</button>
  <button id="stop" type="button" hidden>Stop worker</button>
</main>
<script type="module" src="./worker.js"></script>
</body>
</html>
